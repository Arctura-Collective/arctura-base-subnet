global:
  resolve_timeout: 5m

route:
  receiver: arctura-webhook
  group_by:
    - alertname
    - service
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: arctura-webhook
    webhook_configs:
      - url: http://replace-with-internal-alert-webhook.example.invalid/arctura
        send_resolved: true

