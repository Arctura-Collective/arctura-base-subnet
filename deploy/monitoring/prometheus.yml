global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/arctura-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: arctura-node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          role: arctura-launch-host
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "arctura_.*"
        action: keep
