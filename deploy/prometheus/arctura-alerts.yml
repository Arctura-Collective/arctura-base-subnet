groups:
  - name: arctura_launch_readiness
    rules:
      - alert: ArcturaMetricsExporterFailed
        expr: arctura_evidence_collector_ok == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Arctura metrics exporter failed"
          description: "The launch metrics textfile exporter could not render current evidence state."

      - alert: ArcturaNeuronServiceDown
        expr: arctura_service_active{service=~"arctura-(miner|validator)"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Arctura neuron service down"
          description: "{{ $labels.service }} is not active according to systemd evidence metrics."

      - alert: ArcturaNeuronRestarted
        expr: increase(arctura_service_restarts_total{service=~"arctura-(miner|validator)"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Arctura neuron restarted"
          description: "{{ $labels.service }} restarted during the monitored window."

      - alert: ArcturaFatalJournalMarker
        expr: increase(arctura_fatal_markers_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Fatal Arctura journal marker observed"
          description: "Fatal marker {{ $labels.marker }} appeared in the evidence window."

      - alert: ArcturaEvidenceGateStillRed
        expr: arctura_evidence_gate_ok == 0 and arctura_evidence_elapsed_hours > 48
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Arctura evidence gate still red after 48 hours"
          description: "The evidence run reached 48 hours but at least one launch gate is still failing."

      - alert: ArcturaMetricsStale
        expr: time() - arctura_evidence_collected_at_seconds > 180
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Arctura launch metrics are stale"
          description: "The metrics textfile has not been refreshed for more than three minutes."

      - alert: ArcturaWeightCommitStalled
        expr: arctura_evidence_elapsed_hours > 3 and arctura_weight_commits_total == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No Arctura weight commit observed after three hours"
          description: "The validator is live but no successful weight commit has appeared in the evidence window."

      - alert: ArcturaValidatorCycleLatencyHigh
        expr: arctura_validator_cycle_latest_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Arctura validator cycle latency is high"
          description: "The latest validator mandate cycle took {{ $value }} seconds from mandate issue to tempo completion."
