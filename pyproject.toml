[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctura-base-subnet"
version = "0.1.0"
description = "The first open-source Bittensor subnet bridging Base blockchain intelligence into the decentralized AI network."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Arctura Collective", email = "council@arctura.network" }
]
keywords = [
    "bittensor", "base", "subnet", "blockchain", "decentralized-ai",
    "resonance-bft", "attestation", "agentkit", "merkle"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dependencies = [
    "bittensor>=9.12.0,<10.0.0",
    "torch>=2.0.0,<3.0.0",
    "web3>=6.0.0,<8.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.24.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich>=13.0.0,<16.0.0",
]

[project.optional-dependencies]
agentkit = [
    "coinbase-agentkit>=0.1.0",
    "cdp-sdk>=0.0.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "bandit>=1.7.5",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://arctura.network/base/"
Repository = "https://github.com/bittensaur/arctura-base-subnet"
Documentation = "https://arctura.network/base/"
"Bug Tracker" = "https://github.com/bittensaur/arctura-base-subnet/issues"

[project.scripts]
arctura = "arctura_base.cli:main"
arctura-benchmark = "arctura_base.benchmark:main"
arctura-miner = "neurons.miner:main"
arctura-validator = "neurons.validator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arctura_base*", "neurons*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["arctura_base"]
omit = ["tests/*", "neurons/*"]
