name: Subnet Cost Ticker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Finney subnet launch cost
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Update ticker data
        run: python scripts/update_subnet_cost_ticker.py

      - name: Commit ticker update
        run: |
          if git diff --quiet -- docs/data/subnet_launch_cost.json; then
            echo "No ticker change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/subnet_launch_cost.json
          git commit -m "Update subnet launch cost ticker"
          git push
